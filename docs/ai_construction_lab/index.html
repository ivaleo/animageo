<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimaGeo AI Construction Lab</title>
<style>
:root {
  color-scheme: light;
  --bg:#f7f8fa; --paper:#fff; --paper-2:#fbfcfd; --ink:#1a1f26;
  --muted:#667085; --line:#e1e4e8; --accent:#4d87c6; --accent-bg:#e4edf8;
  --bad:#b42318; --bad-bg:#fce6e4; --warn:#b54708; --warn-bg:#fff3d6;
  --good:#067647; --good-bg:#e3f4e9; --code-bg:#272b32; --code-fg:#e8eaed;
  --code-kw:#c591e0; --code-str:#9dce65; --code-num:#e5a73c;
  --code-cmt:#7e8894; --code-dsl:#7eb0e0;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
header { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
.bar { max-width:1480px; margin:0 auto; padding:9px 14px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; }
h1 { font-size:17px; margin:0; letter-spacing:0; }
.sub { color:var(--muted); margin-top:1px; font-size:12px; }
.actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
button, select, input[type="search"], input[type="text"] { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; padding:6px 9px; font:inherit; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.export-status { color:var(--muted); font-size:12px; min-width:120px; }
.export-status.ok { color:var(--good); }
.export-status.err { color:var(--bad); }
main { max-width:1480px; margin:0 auto; padding:12px 14px; }
.add-case { margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); overflow:hidden; }
.add-case summary { cursor:pointer; padding:8px 11px; color:#344054; font-weight:650; }
.add-case form { border-top:1px solid var(--line); padding:10px 11px; background:var(--paper-2); }
.add-grid { display:grid; grid-template-columns:300px 1fr; gap:8px 10px; align-items:start; }
.field { display:grid; gap:4px; min-width:0; }
.field-wide { grid-column:1 / -1; }
.field span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.055em; }
.advanced-add { border:1px solid var(--line); border-radius:6px; background:#fff; }
.advanced-add summary { padding:7px 9px; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; }
.advanced-add textarea { border:0; border-top:1px solid var(--line); border-radius:0 0 6px 6px; width:100%; }
.mono-input { min-height:132px; font:11.5px/1.48 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.add-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
.add-status { color:var(--muted); font-size:12px; }
.add-status.ok { color:var(--good); }
.add-status.err { color:var(--bad); }
.stats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.variant-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.variant-tab { cursor:pointer; border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:#fff; color:#344054; font:inherit; }
.variant-tab.selected { border-color:var(--accent); color:var(--accent); background:#eef6ff; font-weight:650; }
.case { background:var(--paper); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; }
.case-head { padding:9px 11px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:10px; align-items:start; }
.case-title { font-size:15px; font-weight:650; margin:0 0 3px; }
.prompt { margin:0; color:#344054; }
.badges { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
.badge, .stat { border:1px solid var(--line); border-radius:999px; padding:2px 7px; color:var(--muted); white-space:nowrap; font-size:11.5px; background:#fff; }
.stat { cursor:pointer; font:inherit; line-height:1.45; }
.stat.selected { border-color:var(--accent); color:var(--accent); background:#eef6ff; }
.case-grid { display:grid; grid-template-columns:minmax(330px,.92fr) minmax(420px,1.08fr); gap:0; }
.pane { padding:9px 11px; min-width:0; }
.pane + .pane { border-left:1px solid var(--line); }
.svg-wrap { background:#fbfbfc; border:1px solid var(--line); border-radius:6px; padding:6px; min-height:220px; display:grid; place-items:center; }
.svg-wrap img { max-width:100%; height:auto; display:block; }
h2 { font-size:11px; text-transform:uppercase; letter-spacing:.055em; color:var(--muted); margin:0 0 6px; }
pre { overflow:auto; margin:0; padding:9px 10px; background:var(--code-bg); color:var(--code-fg); border-radius:6px; border:1px solid #1d222a; font:11.5px/1.48 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; max-height:260px; }
pre code { color:inherit; background:none; padding:0; }
.kw { color:var(--code-kw); } .str { color:var(--code-str); } .num { color:var(--code-num); } .cmt { color:var(--code-cmt); font-style:italic; } .dsl { color:var(--code-dsl); }
.meta-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
.notes, .expected { margin:0; padding-left:16px; color:#344054; }
.notes li, .expected li { margin:1px 0; }
details.style-details { margin-top:8px; border:1px solid var(--line); border-radius:6px; background:var(--paper-2); }
details.style-details summary { cursor:pointer; padding:6px 8px; color:var(--muted); font-weight:650; font-size:11px; text-transform:uppercase; letter-spacing:.055em; }
details.style-details pre { border:0; border-top:1px solid var(--line); border-radius:0 0 6px 6px; max-height:220px; }
.feedback { border-top:1px solid var(--line); padding:8px 11px 9px; display:grid; grid-template-columns:minmax(230px,.72fr) minmax(420px,1.28fr); gap:10px; background:#fcfcfd; }
.feedback-head { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.chip-row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.chip { display:inline-flex; align-items:center; min-height:24px; border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#fff; color:#344054; cursor:pointer; user-select:none; font-size:12px; }
.chip input { position:absolute; opacity:0; pointer-events:none; }
.chip.selected { border-color:var(--accent); background:var(--accent-bg); color:#174a76; font-weight:650; }
.chip.rating-pass.selected { border-color:var(--good); background:var(--good-bg); color:var(--good); }
.chip.rating-fail.selected, .chip.rating-unsafe.selected { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.rating-partial.selected { border-color:var(--warn); background:var(--warn-bg); color:var(--warn); }
textarea { width:100%; min-height:54px; resize:vertical; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
.saved { color:var(--good); font-size:11px; min-height:15px; }
.hidden { display:none; }
@media (max-width:980px) {
  .bar, .case-head, .feedback { grid-template-columns:1fr; }
  .case-grid, .meta-row, .add-grid { grid-template-columns:1fr; }
  .pane + .pane { border-left:0; border-top:1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div>
      <h1>AnimaGeo AI Construction Lab</h1>
      <div class="sub">Запросы, AI DSL, SVG и ручная обратная связь</div>
    </div>
    <div class="actions">
      <input id="search" type="search" placeholder="Search">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="unset">Unset</option>
        <option value="pass">Pass</option>
        <option value="partial">Partial</option>
        <option value="fail">Fail</option>
        <option value="unsafe">Unsafe</option>
      </select>
      <button id="importBtn">Import feedback</button>
      <button class="primary" id="exportBtn">Export feedback</button>
      <span id="exportStatus" class="export-status"></span>
      <input id="importFile" type="file" accept="application/json" class="hidden">
    </div>
  </div>
</header>
<main>
  <details class="add-case" id="addCasePanel">
    <summary>Generate manual case</summary>
    <form id="addCaseForm">
      <div class="add-grid">
        <label class="field"><span>Title</span><input id="addTitle" type="text" placeholder="Optional"></label>
        <label class="field field-wide"><span>Prompt</span><textarea id="addPrompt" required placeholder="Запрос пользователя. Сервер вызовет AI с текущим context-файлом и отрендерит SVG."></textarea></label>
        <details class="field field-wide advanced-add">
          <summary>Advanced: paste AI response JSON or construction DSL instead of calling AI</summary>
          <textarea id="addResponse" class="mono-input" placeholder='{"schema":"animageo-ai-construction-response/v1","mode":"create","construction_dsl":"A = Point(0, 0)\n...","style":null,"notes":[]}'></textarea>
        </details>
      </div>
      <div class="add-actions"><button class="primary" type="submit">Generate and render</button><span id="addCaseStatus" class="add-status"></span></div>
    </form>
  </details>
  <div class="variant-tabs" id="variantTabs"></div>
  <div class="stats" id="stats"></div>
  <div id="cases"></div>
</main>

lar bisectors\nmid_AB = Midpoint(A, B)\nperp_AB = PerpendicularLine(mid_AB, Line(A, B))\nmid_CD = Midpoint(C, D)\nperp_CD = PerpendicularLine(mid_CD, Line(C, D))\nO = Intersect(perp_AB, perp_CD)\n# Mark right angles at midpoints\n# For each perpendicular bisector, we need a right angle between the bisector and the chord\n# Use a point on the chord to define the angle\n# For chord AB, right angle at mid_AB between AB and perp_AB\n# Create a point on AB for angle arms\n# Actually, we can use the chord segment and the perpendicular line\n# But Angle requires three points. Use a point on the chord line.\n# Let's create a point on AB (not A or B) for the angle\n# Use the midpoint itself as vertex, and two points on the lines\n# For perp_AB, we need a point on perp_AB other than mid_AB\n# Use O as that point (since O lies on perp_AB)\n# For chord AB, use A or B as the other point\nangle1 = Angle(A, mid_AB, O)\nstyle(angle1, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\nangle2 = Angle(C, mid_CD, O)\nstyle(angle2, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n# Hide helper center and construction lines\nhide(O_hidden, perp_AB, perp_CD)\n# Keep circle visible\nstyle(circle, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(O, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\nstyle(A, B, C, D, label_visible=True)\n# Also show chords\nchord_AB = Segment(A, B)\nchord_CD = Segment(C, D)\nstyle(chord_AB, chord_CD, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n", "dsl_path": "assets/dsl/flash__create_circle_center_from_two_chords.py", "svg_path": "assets/results/flash__create_circle_center_from_two_chords.svg", "hash": "a7ab5e68d09ed6ad", "status": "rendered", "diagnostics": [{"type": "validation", "severity": "error", "code": "self_debating_dsl_comments", "message": "Keep generated DSL comments declarative; do not include self-corrections or reasoning traces in comments."}, {"ty rd radius formula", "does not use arbitrary approximate tangent circles"], "mode": "create", "notes": ["Used standard Pappus chain formula: r_n = (r1*r2*R) / (n^2*(r1+r2)^2 + r1*r2) with R = r1+r2.", "Center coordinates derived from tangency conditions to left and right semicircles.", "Computed numeric values for r1=1.5, r2=2.5: r1≈0.7595, r2≈0.2214.", "Hidden helper centers O, O1, O2 to keep diagram clean."], "style": null, "dsl": "# Arbelos with first two Pappus chain circles\n# Outer semicircle on AB, left semicircle on AC, right semicircle on CB\nA = Point(-4, 0)\nC = Point(-1, 0)\nB = Point(4, 0)\n\nouter = Semicircle(A, B)\nleft = Semicircle(A, C)\nright = Semicircle(C, B)\n\nAB = Segment(A, B)\nAC = Segment(A, C)\nCB = Segment(C, B)\n\n# Arbelos radii\nR = 4  # outer radius (AB/2)\nr1 = 1.5  # left radius (AC/2)\nr2 = 2.5  # right radius (CB/2)\n\n# Center of outer semicircle\nO = Point(0, 0)\n\n# First Pappus circle (n=1): radius = (r1*r2*R) / (r1^2 + r1*r2 + r2^2) ???\n# Standard formula: for chain circles tangent to left and right semicircles and outer semicircle\n# Using Descartes circle theorem or known formula:\n# For arbelos with radii r1, r2, the nth Pappus circle has radius r_n = (r1*r2*R) / (n^2 * (r1+r2)^2 + r1*r2)\n# Actually simpler: r_n = (r1*r2*R) / (n^2 * (r1+r2)^2 + r1*r2) ???\n# Let's use known result: r_n = (r1*r2) / (n^2 * (r1+r2) + r1*r2/R) ???\n# Better: use formula from geometry: r_n = (r1*r2*R) / (n^2 * (r1+r2)^2 + r1*r2)\n# But R = r1+r2, so r_n = (r1*r2*(r1+r2)) / (n^2 * (r1+r2)^2 + r1*r2) = (r1*r2) / (n^2*(r1+r2) + r1*r2/(r1+r2))\n# Actually simpler: r_n = (r1*r2) / (n^2*(r1+r2) + r1*r2/(r1+r2))? Let's compute numerically.\n\n# Use known formula: r_n = (r1*r2) / (n^2*(r1+r2) + r1*r2/(r1+r2))? No.\n# Standard: r_n = (r1*r2*R) / (n^2 * (r1+r2)^2 + r1*r2) with R = r1+r2 => r_n = (r1*r2*(r1+r2)) / (n^2*(r1+r2)^2 + r1*r2) = (r1*r2) / (n^2*(r1+r2) + r1*r2/(r1+r2))\n# Let's compute directly with numbers.\n\nr1_val = 1.5\nr2_val = 2.5\nR_va \nO = Intersect(perp_bis_AB, perp_bis_BC)\ncircumcircle = Circle(O, A)\nstyle(circumcircle, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\nhide(perp_bis_AB, perp_bis_BC)\n\n# Point P on circumcircle (choose a generic point by rotating A around O)\nP = Rotate(A, 2.0, O)\nstyle(P, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\n\n# Simson line: feet of perpendiculars from P to the three side lines\n# Side lines (infinite lines through triangle sides)\nline_AB = Line(A, B)\nline_BC = Line(B, C)\nline_CA = Line(C, A)\n\n# Perpendicular lines from P to each side line\nperp_AB = PerpendicularLine(P, line_AB)\nperp_BC = PerpendicularLine(P, line_BC)\nperp_CA = PerpendicularLine(P, line_CA)\n\n# Feet (intersections of perpendiculars with side lines)\nfoot_AB = Intersect(perp_AB, line_AB)\nfoot_BC = Intersect(perp_BC, line_BC)\nfoot_CA = Intersect(perp_CA, line_CA)\n\n# Hide helper lines\nhide(line_AB, line_BC, line_CA, perp_AB, perp_BC, perp_CA)\n\n# Draw the Simson line through two of the feet\nsimson_line = Line(foot_AB, foot_BC)\nstyle(simson_line, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Mark right angles at feet (optional but clarifies perpendicularity)\nright_angle_AB = Angle(A, foot_AB, P)\nright_angle_BC = Angle(B, foot_BC, P)\nright_angle_CA = Angle(C, foot_CA, P)\nstyle(right_angle_AB, right_angle_BC, right_angle_CA, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Style feet\nstyle(foot_AB, foot_BC, foot_CA, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=False)\n", "dsl_path": "assets/dsl/pro__create_simson_line.py", "svg_path": "assets/results/pro__create_simson_line.svg", "hash": "aa46718542eefbb8", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 57.453514779055446}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 26, "diagnostics": []}}, {"id": "create_gergonne_point", "title": (B, E)\nline_CF = Line(C, F)\n\nGe = Intersect(line_AD, line_BE)\nstyle(Ge, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True, label_text=\"$Ge$\")\n\n# Hide construction lines for Gergonne point\nhide(line_AD, line_BE, line_CF)\n\n# Draw segments from vertices to touch points for visibility\nAD_seg = Segment(A, D)\nBE_seg = Segment(B, E)\nCF_seg = Segment(C, F)\nstyle(AD_seg, BE_seg, CF_seg, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", stroke_dasharray=\"4 2\")\n", "dsl_path": "assets/dsl/pro__create_gergonne_point.py", "svg_path": "assets/results/pro__create_gergonne_point.svg", "hash": "4295a954325b719e", "status": "rendered", "diagnostics": [], "viewport": {"width": 760, "height": 500, "scale": 60.57266631070595}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 26, "diagnostics": []}}, {"id": "create_symmedian_point", "title": "Symmedian Point", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй симмедианную точку треугольника как изогональное сопряжение центра тяжести.", "expected": ["constructs centroid", "uses IsogonalConjugation", "draws symmedians through K"], "mode": "create", "notes": ["Centroid G constructed via Centroid helper.", "Symmedian point K is the isogonal conjugate of G.", "Symmedians drawn as segments from each vertex to K."], "style": null, "dsl": "# Triangle ABC\nA = Point(-3, -1)\nB = Point(3, -1)\nC = Point(1, 4)\n\n# Sides\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\n# Centroid G\nG = Centroid(A, B, C)\nstyle(G, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Isogonal conjugate of G (symmedian point K)\nK = IsogonalConjugation(A, B, C, G)\nstyle(K, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Symmedians: segments from vertices to K\nAK = Segment(A, K)\nBK = Segment(B, K)\nCK = Segment( ed side order to place the third vertex outside ABC.", "Centers of equilateral triangles are their centroids, which coincide with circumcenters and incenters.", "External triangle vertices are hidden to keep the diagram focused on the Napoleon triangle."], "style": null, "dsl": "# Given triangle ABC\nA = Point(-3, -1)\nB = Point(3, -1)\nC = Point(0, 4)\nstyle(A, B, C, label_visible=True)\n\n# Sides of ABC\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\n# External equilateral triangles on each side\n# On AB (external, so vertex opposite C)\ntri_AB, _, _, _, C_AB = Polygon(B, A, 3)\nstyle(tri_AB, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", fill_opacity=0.1)\n\n# On BC (external, vertex opposite A)\ntri_BC, _, _, _, A_BC = Polygon(C, B, 3)\nstyle(tri_BC, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", fill_opacity=0.1)\n\n# On CA (external, vertex opposite B)\ntri_CA, _, _, _, B_CA = Polygon(A, C, 3)\nstyle(tri_CA, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", fill_opacity=0.1)\n\n# Centers of the external equilateral triangles (centroids)\nO_AB = Centroid(tri_AB)\nO_BC = Centroid(tri_BC)\nO_CA = Centroid(tri_CA)\nstyle(O_AB, O_BC, O_CA, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Napoleon triangle (connecting the centers)\nnap_tri, nap_AB, nap_BC, nap_CA = Polygon(O_AB, O_BC, O_CA)\nstyle(nap_tri, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\", fill_opacity=0.15)\nstyle(nap_AB, nap_BC, nap_CA, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Hide the external triangle vertices (keep only centers)\nhide(C_AB, A_BC, B_CA)\n\n# Optional: mark the external triangles as equilateral with tick marks on their sides\n# (but they are already hidden, so we skip that for cleanliness)\n", "dsl_path": "assets/dsl/pro__create_napoleon_triangle.py", "svg_path": "assets/results/pro__create_nap \")\n\n# Style points\nstyle(O, A, fill=\"color.main\", size_px=\"point_size.main\", label_visible=False)\nstyle(P, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\nstyle(A1, B1, C1, D1, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Label intersection points with subscripts\nstyle(A1, label_text=\"$A_1$\")\nstyle(B1, label_text=\"$B_1$\")\nstyle(C1, label_text=\"$C_1$\")\nstyle(D1, label_text=\"$D_1$\")\n", "dsl_path": "assets/dsl/pro__create_power_of_point_secants.py", "svg_path": "assets/results/pro__create_power_of_point_secants.svg", "hash": "ad58b7840e3f77b6", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 80.47055518824168}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 17, "diagnostics": []}}, {"id": "create_polar_line_circle", "title": "Polar Line Of A Point", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй полярную прямую внешней точки P относительно окружности и точки касания касательных.", "expected": ["uses Polar(P, circle)", "confirms it through tangent contact points", "shows tangent segments"], "mode": "create", "notes": ["Constructed circle with center O and external point P.", "Used Tangent(P, circle) to get two tangent lines, derived contact points T1 and T2.", "Drew finite tangent segments PT1 and PT2, hid infinite tangent lines.", "Constructed polar line of P with respect to the circle using Polar(P, circle).", "Marked right angles at tangent points with radius segments OT1, OT2.", "Used separate style calls for T1 and T2 to set distinct label_text values, avoiding repeated keyword argument error."], "style": null, "dsl": "# Given circle with center O and external point P\nO = Point(0, 0)\nA = Point(2, 0)\ncircle = Circle(O, A)\nP = Point(5, 2)\n\n# Tangents from P to the circle\nt1, t2 = Tangent(P, circle)\nT1 = Intersect(t1, circle)\nT2 = Intersect(t2, circle)\n\n# Tangent seg reate", "notes": ["Ellipse defined by foci F1(-2,0), F2(2,0) and semi-major axis 3.", "External point P at (4,2) chosen to give two real tangents.", "Tangent points T1, T2 derived from intersection of tangent lines with ellipse.", "Infinite tangent lines hidden; only finite segments PT1, PT2 shown.", "Labels use subscript notation for foci and tangent points."], "style": null, "dsl": "# Ellipse with two tangents from external point P\n\n# Ellipse: foci F1, F2, semi-major axis length 3\nF1 = Point(-2, 0)\nF2 = Point(2, 0)\nellipse = Ellipse(F1, F2, 3)\n\n# External point P\nP = Point(4, 2)\n\n# Tangents from P to ellipse\nt1, t2 = Tangent(P, ellipse)\n\n# Tangent points\nT1 = Intersect(t1, ellipse)\nT2 = Intersect(t2, ellipse)\n\n# Visible tangent segments\nPT1 = Segment(P, T1)\nPT2 = Segment(P, T2)\n\n# Hide infinite tangent lines\nhide(t1, t2)\n\n# Style\nstyle(ellipse, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(F1, F2, fill=\"color.main\", size_px=\"point_size.main\", label_visible=True)\nstyle(F1, label_text=\"$F_1$\")\nstyle(F2, label_text=\"$F_2$\")\nstyle(P, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\nstyle(T1, T2, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\nstyle(T1, label_text=\"$T_1$\")\nstyle(T2, label_text=\"$T_2$\")\nstyle(PT1, PT2, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n", "dsl_path": "assets/dsl/pro__create_ellipse_tangents_from_point.py", "svg_path": "assets/results/pro__create_ellipse_tangents_from_point.svg", "hash": "66ca954d327a0836", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 84.72801261583236}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 12, "diagnostics": []}}, {"id": "create_implicit_lemniscate_line_intersections", "title": "Implicit Lemniscate Intersections", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй лемнискату и прямую, отметь точки их пересечения.", "expected": ["uses ImplicitCurve string syntax", "intersects with a line", "marks the selected visible intersection points only", "does not connect intersections unless requested"], "mode": "create", "notes": ["Lemniscate defined as implicit curve (x^2 + y^2)^2 = 4*(x^2 - y^2).", "Line chosen to intersect the lemniscate in 4 points for a clear example.", "Intersection points are labeled automatically with their variable names."], "style": null, "dsl": "# Lemniscate of Bernoulli: (x^2 + y^2)^2 = a^2 (x^2 - y^2)\n# Choose a = 2 for a visible size\nlemniscate = ImplicitCurve(\"(x^2 + y^2)^2 - 4*(x^2 - y^2)\")\n\n# A generic line intersecting the lemniscate\n# Choose a line through two points that will intersect the curve in 4 points\nP = Point(-2, 1)\nQ = Point(2, -1)\nline = Line(P, Q)\n\n# Intersection points (expect 4 in this configuration)\nI1, I2, I3, I4 = Intersect(lemniscate, line)\n\n# Style the lemniscate as the main curve\nstyle(lemniscate, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\n# Style the line as secondary\nstyle(line, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\n\n# Mark intersection points with accent color and bold size\nstyle(I1, I2, I3, I4, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Hide the helper points used to define the line\nhide(P, Q)\n", "dsl_path": "assets/dsl/pro__create_implicit_lemniscate_line_intersections.py", "svg_path": "assets/results/pro__create_implicit_lemniscate_line_intersections.svg", "hash": "0eddcce05a0a6442", "status": "rendered", "diagnostics": [], "viewport": {"width": 760, "height": 500, "scale": 154.47007289775252}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 9, "diagnostics": []}}, {"id": "create_function_circle_intersections", "title": "Function And Circle Intersections", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй график синуса, окружность и отметь точки их пересечения.", "expected": ["uses Function and Circle intersection", "marks multiple roots", "uses indexed-style point labels when generated by runtime"], "mode": "create", "notes": ["Intersection points are determined by the system; their exact coordinates depend on the numerical solver.", "The circle is a unit circle centered at the origin.", "The sine function is plotted over the default domain."], "style": null, "dsl": "# Sine function and unit circle with intersection points\n\n# Unit circle centered at origin\nO = Point(0, 0)\nA = Point(1, 0)\ncircle = Circle(O, A)\n\n# Sine function\nsine = Function(\"sin(x)\")\n\n# Intersection points between sine and circle\n# Circle equation: x^2 + y^2 = 1, y = sin(x)\n# We'll find intersections in the visible range\nP1, P2 = Intersect(sine, circle)\n\n# Style the circle and sine\nstyle(circle, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(sine, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Style intersection points\nstyle(P1, P2, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Hide the circle center and radius point\nhide(O, A)\n", "dsl_path": "assets/dsl/pro__create_function_circle_intersections.py", "svg_path": "assets/results/pro__create_function_circle_intersections.svg", "hash": "7c97dbc27dee0b7a", "status": "rendered", "diagnostics": [], "viewport": {"width": 760, "height": 500, "scale": 51.97736013351716}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 8, "diagnostics": []}}, {"id": "create_circle_sector_and_arc", "title": "Circle Sector And Arc", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй сектор AOB окружности, выдели дугу AB и хорду AB.", "expected": ["uses CircleSector and CircleArc", "shows radii, chord and arc", "labels central angle"], "mode": "create", "notes": ["Radii OA and OB are drawn explicitly as requested by lab checks.", "Central angle AOB is created and labeled.", "Circle is hidden to keep focus on sector, arc, and chord.", "Arc AB is drawn via CircleArc(O, A, B) which goes CCW from A to B."], "style": null, "dsl": "O = Point(0, 0)\nA = Point(3, 0)\nB = Rotate(A, 2 * pi / 3, O)\ncircle = Circle(O, A)\nsector = CircleSector(O, A, B)\nOA = Segment(O, A)\nOB = Segment(O, B)\nchord = Segment(A, B)\narc = CircleArc(O, A, B)\ncentral_angle = Angle(A, O, B)\nstyle(sector, stroke=\"color.main\", stroke_width_px=\"line_width.main\", fill=\"color.aux\", fill_opacity=0.2)\nstyle(OA, OB, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(chord, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(arc, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(central_angle, arc_size_px=\"angle_radius.bold\", label_visible=True, label_text=\"$\\\\angle AOB$\")\nstyle(O, A, B, label_visible=True, fill=\"color.main\", size_px=\"point_size.main\")\nhide(circle)\n", "dsl_path": "assets/dsl/pro__create_circle_sector_and_arc.py", "svg_path": "assets/results/pro__create_circle_sector_and_arc.svg", "hash": "786986d824c53bd6", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 109.35527893174176}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 12, "diagnostics": []}}, {"id": "create_circumcircle_arc_triangle", "title": "Circumcircle Arc Through Three Points", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй дугу окружности через точки A, B, C так, чтобы она проходила через B.", "expected": ["uses CircumcircleArc(A, B, C)", "keeps full circle as helper", "labels the three defining points"], "mode": "create", "notes": ["Построена дуга через A, B, C с помощью CircumcircleArc.", "Полная окружность оставлена как вспомогательная (color.aux, line_width.aux).", "Точки A, B, C помечены."], "style": null, "dsl": "A = Point(0, 0)\nB = Point(2, 1)\nC = Point(1, 3)\ncircle = Circle(A, B, C)\narc = CircumcircleArc(A, B, C)\nstyle(arc, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(circle, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\nstyle(A, B, C, label_visible=True, fill=\"color.main\", size_px=\"point_size.main\")\n", "dsl_path": "assets/dsl/pro__create_circumcircle_arc_triangle.py", "svg_path": "assets/results/pro__create_circumcircle_arc_triangle.svg", "hash": "b2f1739dca62d925", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 106.84086460165646}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 7, "diagnostics": []}}, {"id": "create_copy_segment_with_circle", "title": "Copy Segment With Compass", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Скопируй длину отрезка AB от точки P вдоль луча PQ.", "expected": ["uses Circle(P, segment) to copy length", "intersects target ray with compass circle", "marks congruent segments"], "mode": "create", "notes": ["Построен отрезок AB и луч PQ.", "Длина AB скопирована на луч PQ с помощью окружности с центром P и радиусом AB.", "Точка X — пересечение окружности и луча, отрезок PX равен AB.", "Отрезки AB и PX выделены и помечены одинаковым количеством штрихов для обозначения равенства.", "Вспомогательные окружность и луч скрыты."], "style": null, "dsl": "A = Point(0, 0)\nB = Point(2, 1)\nP = Point(-1, 2)\nQ = Point(1, 3)\n\nAB = Segment(A, B)\nray_PQ = Ray(P, Q)\n\ncircle_P_AB = Circle(P, AB)\nX = Intersect(circle_P_AB, ray_PQ)\nPX = Segment(P, X)\n\nstyle(AB, PX, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(AB, PX, tick_count=1)\n\nstyle(A, B, P, Q, X, label_visible=True)\nhide(circle_P_AB, ray_PQ)\n", "dsl_path": "assets/dsl/pro__create_copy_segment_with_circle.py", "svg_path": "assets/results/pro__create_copy_segment_with_circle.svg", "hash": "2979f08399163dc6", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 107.27766851560658}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 11, "diagnostics": []}}, {"id": "create_copy_angle_by_rotation", "title": "Copy Angle By Rotation", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Скопируй угол BAC в вершину P на луч PQ.", "expected": ["constructs target ray by rotating Q around P by the source angle", "marks source and copied angles equal"], "mode": "create", "notes": ["Used rotation to copy angle BAC to vertex P on ray PQ.", "Angle size measured from B-A-C and applied to rotate Q around P.", "Both original and copied angles marked with one tick for equality."], "style": null, "dsl": "# Copy angle BAC to vertex P on ray PQ\n\n# Given: angle BAC and ray PQ\nA = Point(0, 0)\nB = Point(3, 1)\nC = Point(2, 3)\nP = Point(5, 0)\nQ = Point(8, 1)\n\n# Draw given angle BAC\nAB = Ray(A, B)\nAC = Ray(A, C)\nang_BAC = Angle(B, A, C)\nstyle(ang_BAC, arc_size_px=\"angle_radius.main\", tick_count=1)\n\n# Draw given ray PQ\nray_PQ = Ray(P, Q)\n\n# Copy angle BAC to vertex P on ray PQ by rotation\n# Rotate Q around P by the measure of angle BAC\nang_size = AngleSize(B, A, C)\nR = Rotate(Q, ang_size, P)\n\n# Draw copied ray PR\nPR = Ray(P, R)\n\n# Mark copied angle QPR\nang_QPR = Angle(Q, P, R)\nstyle(ang_QPR, arc_size_px=\"angle_radius.main\", tick_count=1)\n\n# Style\nstyle(AB, AC, ray_PQ, PR, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(A, B, C, P, Q, R, label_visible=True, fill=\"color.main\", size_px=\"point_size.main\")\nstyle(ang_BAC, ang_QPR, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n", "dsl_path": "assets/dsl/pro__create_copy_angle_by_rotation.py", "svg_path": "assets/results/pro__create_copy_angle_by_rotation.svg", "hash": "90a18eef94b1953a", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 73.40738342409605}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 14, "diagnostics": []}}, {"id": "create_triangle_with_area_measure", "title": "Triangle Area And Perimeter Measures", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй треугольник ABC и добавь измерения площади и периметра.", "expected": ["uses Area and Perimeter measure commands", "shows the triangle area as a value label", "shows the perimeter as a static measurement label pending standalone measure labels"], "mode": "create", "notes": ["Area label attached to polygon; perimeter label attached to side BC to avoid two competing labels on the same host.", "Measurements formatted as static labels via .data.value; label_mode not used."], "style": null, "dsl": "A = Point(0, 0)\nB = Point(4, 0)\nC = Point(1, 3)\n\ntri, AB, BC, CA = Polygon(A, B, C)\n\narea_measure = Area(tri)\nperimeter_measure = Perimeter(tri)\n\nstyle(tri, label_visible=True, label_text=f\"Area = {area_measure.data.value:.2f}\")\nstyle(BC, label_visible=True, label_text=f\"Perimeter = {perimeter_measure.data.value:.2f}\")\n\nstyle(A, B, C, label_visible=True, fill=\"color.strong\", size_px=\"point_size.bold\")\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n", "dsl_path": "assets/dsl/pro__create_triangle_with_area_measure.py", "svg_path": "assets/results/pro__create_triangle_with_area_measure.svg", "hash": "a9ee0d49b884c34a", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 101.06330246520467}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 9, "diagnostics": []}}, {"id": "create_angle_sum_triangle", "title": "Triangle Angle Sum", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй треугольник ABC и отметь три его внутренних угла разными засечками.", "expected": ["constructs three interior angle objects", "uses distinct labels and tick groups", "does not globally restyle angles"], "mode": "create", "notes": [], "sty  the exterior angle at C\nD = C + (C - A)\nCD = Segment(C, D)\nstyle(CD, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", stroke_dasharray=\"4 4\")\n\n# Exterior angle at C: angle between extension CD and side CB\next_angle = Angle(D, C, B)\nstyle(ext_angle, arc_size_px=\"angle_radius.main\", tick_count=1)\n\n# Remote interior angles: at A and B\nint_angle_A = Angle(B, A, C)\nint_angle_B = Angle(A, B, C)\nstyle(int_angle_A, int_angle_B, arc_size_px=\"angle_radius.main\", tick_count=2)\n", "dsl_path": "assets/dsl/pro__create_external_angle_theorem.py", "svg_path": "assets/results/pro__create_external_angle_theorem.svg", "hash": "3395c846bb59f1cb", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 55.76684556224942}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 14, "diagnostics": []}}, {"id": "create_angle_bisectors_incenter", "title": "Angle Bisectors And Incenter", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй три биссектрисы треугольника и их точку пересечения.", "expected": ["constructs three angle bisectors", "marks incenter", "marks equal angle pairs for two vertices"], "mode": "create", "notes": ["Used AngularBisector for each vertex, intersected with opposite side to get finite bisector segments.", "Each vertex's equal-angle pair has its own tick_count: 1 for A, 2 for B, 3 for C.", "Incenter I is intersection of two bisectors; third bisector passes through it by concurrency.", "Hidden infinite bisector helper lines; only finite segments AD, BE, CF are visible."], "style": null, "dsl": "A = Point(0, 0)\nB = Point(6, 1)\nC = Point(2, 5)\n\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\n\nbis_A = AngularBisector(B, A, C)\nbis_B = AngularBisector(C, B, A)\nbis_C = AngularBisector(A, C, B)\n\nD = Intersect(bis_A, BC)\nE = Intersect(bis_B, CA)\nF = Intersect(bis_C, AB)\n\nAD = Segment(A, D)\nBE = Segment(B, E)\nCF = Segment(C, F)\ endicularBisector(A, B)\nperp_bis_CD = PerpendicularBisector(C, D)\n\n# Intersection of the perpendicular bisectors is the center\nO = Intersect(perp_bis_AB, perp_bis_CD)\n\n# Style the found center\nstyle(O, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True, label_text=\"O\")\n\n# Hide the original hidden center and its helper point\nhide(O_hidden, P)\n\n# Style chords and perpendicular bisectors\nstyle(AB, CD, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(perp_bis_AB, perp_bis_CD, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\n\n# Mark midpoints of chords (optional, for clarity)\nM_AB = Midpoint(A, B)\nM_CD = Midpoint(C, D)\nstyle(M_AB, M_CD, fill=\"color.aux\", size_px=\"point_size.aux\", label_visible=False)\n\n# Right angle markers at midpoints\nright_angle_AB = Angle(A, M_AB, O)\nright_angle_CD = Angle(C, M_CD, O)\nstyle(right_angle_AB, right_angle_CD, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Keep circle visible\nstyle(circle, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n", "dsl_path": "assets/dsl/pro__create_circle_center_from_two_chords.py", "svg_path": "assets/results/pro__create_circle_center_from_two_chords.svg", "hash": "e374584003fbf65d", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 67.08333333333334}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 18, "diagnostics": []}}, {"id": "create_common_chord_lens", "title": "Common Chord Lens", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй две пересекающиеся окружности, их общую хорду и линзу между ними.", "expected": ["constructs intersection points", "draws common chord", "highlights boundary arcs of the lens"], "mode": "create", "notes": ["Circles share the same radius for simplicity; they intersect at two points.", "Lens is drawn as two circular arcs with a semi-transparent fill.", "Common chord is highlighted in accent color."], "style": null, "dsl": "# Two intersecting circles, their common chord, and the lens between them.\n\n# Free points: centers and one point on the first circle.\nO1 = Point(-2, 0)\nO2 = Point(2, 0)\nA = Point(-2, 2.5)\n\n# Circles\nc1 = Circle(O1, A)\nc2 = Circle(O2, A)  # same radius for simplicity; circles intersect\n\n# Intersection points of the circles (common chord endpoints)\nP, Q = Intersect(c1, c2)\n\n# Common chord\nchord = Segment(P, Q)\n\n# Lens: the two circular arcs between P and Q.\n# Use CircleArc with center and two endpoints. Order determines which arc.\n# For the upper arc (counterclockwise from P to Q on c1)\narc1 = CircleArc(O1, P, Q)\n# For the lower arc (clockwise from P to Q on c2, i.e., counterclockwise from Q to P on c2)\narc2 = CircleArc(O2, Q, P)\n\n# Style\nstyle(O1, O2, label_visible=True, fill=\"color.main\", size_px=\"point_size.main\")\nstyle(A, label_visible=False, fill=\"color.aux\", size_px=\"point_size.aux\")\nstyle(c1, c2, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(chord, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(arc1, arc2, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\", fill=\"color.aux\", fill_opacity=0.2)\nstyle(P, Q, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\n", "dsl_path": "assets/dsl/pro__create_common_chord_lens.py", "svg_path": "assets/results/pro__create_common_chord_lens.svg", "hash": "7511157c3dd7935d", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 44.69871322926148}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 12, "diagnostics": []}}, {"id": "create_arbelos_three_semicircles", "title": "Arbelos Three Semicircles", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй арбелос из трех полуокружностей на одном диаметре.", "expected": ["uses three semicircles on aligned points d Pappus-chain formula for n=1,2 in a normalized arbelos with AC/AB = 1/3, scaled to diameter 6.", "The center height is y = 2*n*r, and the circle radius depends on n*n.", "The arbelos baseline remains visible."], "style": null, "dsl": "A = Point(-3, 0)\nC = Point(-1, 0)\nB = Point(3, 0)\n\nouter = Semicircle(A, B)\nleft = Semicircle(A, C)\nright = Semicircle(C, B)\nAB = Segment(A, B)\nAC = Segment(A, C)\nCB = Segment(C, B)\n\ndiameter = 6.0\nbase_x = -3.0\nbase_y = 0.0\nratio = 1.0 / 3.0\n\nfor n in range(1, 3):\n    denom = n * n * (1 - ratio) * (1 - ratio) + ratio\n    r = diameter * ((1 - ratio) * ratio) / (2 * denom)\n    x = base_x + diameter * (ratio * (1 + ratio)) / (2 * denom)\n    y = base_y + 2 * n * r\n    O_n = Point(x, y, name=f\"O{n}\")\n    k_n = Circle(O_n, r, name=f\"k{n}\")\n    style(O_n, label_visible=True, label_text=f\"$O_{n}$\", fill=\"color.accent\", size_px=\"point_size.aux\")\n    style(k_n, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\nstyle(A, B, C, label_visible=True)\nstyle(outer, left, right, stroke=\"color.aux\", stroke_width_px=\"line_width.bold\")\nstyle(AB, stroke=\"color.strong\", stroke_width_px=\"line_width.aux\")\nstyle(AC, CB, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\n", "dsl_path": "assets/dsl/pro__create_pappus_chain_start.py", "svg_path": "assets/results/pro__create_pappus_chain_start.svg", "hash": "8588b5a2850912b2", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 92.81612839502077}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 15, "diagnostics": []}}, {"id": "create_same_chord_angles", "title": "Inscribed Angles On Same Chord", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй окружность, хорду AB и два вписанных угла ACB и ADB, опирающиеся на одну хорду AB.", "expected": ["constructs four points on one circle", "draws chord AB", "marks the two inscribed angles as equal"], rcle\nt1, t2 = Tangent(P, circle)\n\n# Find tangent points\nT1 = Intersect(t1, circle)\nT2 = Intersect(t2, circle)\n\n# Draw tangent segments\nPT1 = Segment(P, T1)\nPT2 = Segment(P, T2)\n\n# Draw radii to tangent points\nOT1 = Segment(O, T1)\nOT2 = Segment(O, T2)\n\n# Mark right angles at tangent points\nright1 = Angle(P, T1, O)\nright2 = Angle(P, T2, O)\n\n# Mark equal tangent segments\nstyle(PT1, PT2, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\", tick_count=1)\n\n# Style radii and right angles\nstyle(OT1, OT2, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\nstyle(right1, right2, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Hide infinite tangent lines\nhide(t1, t2)\n\n# Style points\nstyle(O, fill=\"color.main\", size_px=\"point_size.main\", label_visible=True)\nstyle(P, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\nstyle(T1, T2, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\n\n# Style circle\nstyle(circle, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n", "dsl_path": "assets/dsl/pro__create_equal_tangents_from_point.py", "svg_path": "assets/results/pro__create_equal_tangents_from_point.svg", "hash": "b4be94dc44fa0b04", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 85.05585932585389}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 16, "diagnostics": []}}, {"id": "create_intersecting_chords_theorem", "title": "Intersecting Chords", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй две хорды окружности, пересекающиеся в точке E внутри окружности.", "expected": ["constructs two chords with endpoints on the circle", "marks internal intersection E", "does not add unrequested product formula as text"], "mode": "create", "notes": ["Chord endpoints B, C, D are constructed on the circle by rotating A around O, ensuring they lie on the circle by dependency.", "Intersection point E is computed from the two chords.", "Angles for rotations chosen to give a clear, non-degenerate configuration."], "style": null, "dsl": "# Given circle with center O and radius OA\nO = Point(0, 0)\nA = Point(4, 0)\ncircle = Circle(O, A)\n\n# Construct chord endpoints on the circle by rotation\nB = Rotate(A, 2.0, O)\nC = Rotate(A, 3.5, O)\nD = Rotate(A, 5.0, O)\n\n# Draw chords AB and CD\nAB = Segment(A, B)\nCD = Segment(C, D)\n\n# Intersection point E inside the circle\nE = Intersect(AB, CD)\n\n# Style the construction\nstyle(circle, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(AB, CD, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(A, B, C, D, E, label_visible=True, fill=\"color.main\", size_px=\"point_size.main\")\nstyle(E, fill=\"color.accent\", size_px=\"point_size.bold\")\n", "dsl_path": "assets/dsl/pro__create_intersecting_chords_theorem.py", "svg_path": "assets/results/pro__create_intersecting_chords_theorem.svg", "hash": "fbd811b2ae8c58ad", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 50.83652910800566}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 11, "diagnostics": []}}, {"id": "create_tangent_secant_power", "title": "Tangent Secant Power", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Покажи теорему о касательной и секущей: из точки P проведи касательную PT и секущую PAB.", "expected": ["constructs tangent and secant from P", "marks tangent point T", "shows finite secant segment through A and B", "adds concise theorem label"], "mode": "create", "notes": ["Секущая проведена через точку Q на окружности, чтобы гарантировать два пересечения.", "Вспомогательная прямая и точка Q скрыты.", "Радиусы показаны пунктиром для связи с центром."], "style": null, "dsl": "# Теорема о касательной и секущей\n# Дано: точка P вне окружности, касательная PT и секущая PAB\n\n# Окружно ng\", stroke_width_px=\"line_width.main\")\nstyle(sq_CA, fill=\"color.aux\", fill_opacity=0.2, stroke=\"color.aux\", stroke_width_px=\"line_width.main\")\n\n# Hide square vertices not part of triangle\nstyle(D, E, F, G, H, I, label_visible=False, size_px=\"point_size.aux\")\n\n# Optional: label square areas (a^2, b^2, c^2)\nstyle(sq_AB, label_text=\"$a^2$\", label_visible=True, font_size_px=\"font_size.bold\")\nstyle(sq_BC, label_text=\"$c^2$\", label_visible=True, font_size_px=\"font_size.bold\")\nstyle(sq_CA, label_text=\"$b^2$\", label_visible=True, font_size_px=\"font_size.bold\")\n", "dsl_path": "assets/dsl/pro__create_pythagorean_squares.py", "svg_path": "assets/results/pro__create_pythagorean_squares.svg", "hash": "d08e628055f5ce88", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 520, "scale": 56.464646464646435}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 30, "diagnostics": []}}, {"id": "create_triangle_midsegment_parallel", "title": "Triangle Midsegment", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй среднюю линию треугольника, соединяющую середины двух сторон, и покажи сторону, которой она параллельна.", "expected": ["constructs two side midpoints", "draws midsegment", "keeps midpoint labels visible because they define the midsegment", "highlights the parallel side"], "mode": "create", "notes": ["Midpoints D and E are labeled and highlighted as requested.", "Equal halves on AB and AC are marked with ticks (different classes since sides are generally unequal).", "Side BC is highlighted as the side parallel to midsegment DE."], "style": null, "dsl": "# Triangle with midsegment connecting midpoints of two sides\nA = Point(0, 0)\nB = Point(6, 0)\nC = Point(2, 5)\n\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\nD = Midpoint(A, B)\nE = Midpoint(A, C)\nDE = Segment le_size_px=\"angle_radius.right\")\n\n# Hide helper perpendicular line\nhide(perp_line)\n", "dsl_path": "assets/dsl/pro__create_parabola_latus_rectum.py", "svg_path": "assets/results/pro__create_parabola_latus_rectum.svg", "hash": "d3a09da270de7f45", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 520, "scale": 49.395509499136445}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 14, "diagnostics": []}}, {"id": "create_ellipse_focal_radii", "title": "Ellipse Focal Radii", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй эллипс с фокусами F1 и F2 и точку P на эллипсе, покажи фокальные радиусы PF1 и PF2.", "expected": ["constructs ellipse by foci and major semiaxis", "chooses a point on the ellipse", "draws both focal radii"], "mode": "create", "notes": ["Point P is derived as an intersection of the ellipse with its minor axis, so it lies on the ellipse by construction.", "Foci labels use separate style calls to avoid overriding label_text.", "The auxiliary second intersection is hidden."], "style": null, "dsl": "F1 = Point(-2, 0)\nF2 = Point(2, 0)\nellipse = Ellipse(F1, F2, 3)\nminor_axis = MinorAxis(ellipse)\nP, P_aux = Intersect(ellipse, minor_axis)\nPF1 = Segment(P, F1)\nPF2 = Segment(P, F2)\nstyle(F1, F2, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\nstyle(F1, label_text=\"$F_1$\")\nstyle(F2, label_text=\"$F_2$\")\nstyle(P, label_visible=True, label_text=\"$P$\", fill=\"color.accent\", size_px=\"point_size.bold\")\nstyle(P_aux, label_visible=False, size_px=\"point_size.aux\")\nstyle(PF1, PF2, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(ellipse, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(minor_axis, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\n", "dsl_path": "assets/dsl/pro__create_ellipse_focal_radii.py", "svg_path": "assets/results/pro__create_ellipse_focal_radii.svg", "hash": " le BCD are equal\nang_ADC = Angle(A, D, C)\nang_BCD = Angle(B, C, D)\nstyle(ang_ADC, ang_BCD, arc_size_px=\"angle_radius.main\", tick_count=2)\n\n# Labels\nstyle(A, B, C, D, label_visible=True)\nstyle(AB, CD, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n", "dsl_path": "assets/dsl/pro__create_isosceles_trapezoid_angles.py", "svg_path": "assets/results/pro__create_isosceles_trapezoid_angles.svg", "hash": "dbdc6c289359c503", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 73.36147636717958}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 14, "diagnostics": []}}, {"id": "create_kite_perpendicular_diagonals", "title": "Kite Perpendicular Diagonals", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй дельтоид ABCD и покажи, что его диагонали перпендикулярны.", "expected": ["constructs kite", "draws both diagonals", "marks their right angle intersection", "marks adjacent equal side pairs"], "mode": "create", "notes": ["Kite constructed via symmetry: AB = AD and CB = CD by reflection across AC.", "Diagonals AC and BD intersect at E; right angle marked at E.", "Symmetry axis AC is hidden after construction; only diagonals are shown."], "style": null, "dsl": "# Kite ABCD with AB = AD and CB = CD, showing perpendicular diagonals\n\n# Choose two opposite vertices on the symmetry axis first\nA = Point(-2, 0)\nC = Point(2, 0)\n\n# Symmetry axis AC\naxis = Line(A, C)\n\n# Choose one off-axis vertex\nB = Point(0, 2)\n\n# Reflect B across axis to get D, ensuring AB = AD and CB = CD\nD = Reflect(B, axis)\n\n# Build kite polygon\nkite, AB, BC, CD, DA = Polygon(A, B, C, D)\n\n# Diagonals\nAC = Segment(A, C)\nBD = Segment(B, D)\n\n# Intersection of diagonals\nE = Intersect(AC, BD)\n\n# Mark right angle at intersection\nright_angle = Angle(A, E, B)\n\n# Style the kite\nstyle(kite, fill=\"color.accent\", fill_opacity=0.15, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\n# Style diagonals\nstyle(AC, BD, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", stroke_dasharray=\"4 2\")\n\n# Mark right angle\nstyle(right_angle, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Label vertices\nstyle(A, B, C, D, label_visible=True)\n\n# Mark adjacent equal side pairs\nstyle(AB, DA, tick_count=1, tick_length_px=\"tick.main\")\nstyle(BC, CD, tick_count=2, tick_length_px=\"tick.main\")\n\n# Hide axis helper\nhide(axis)\n", "dsl_path": "assets/dsl/pro__create_kite_perpendicular_diagonals.py", "svg_path": "assets/results/pro__create_kite_perpendicular_diagonals.svg", "hash": "038294792fdd5337", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 83.13796536781712}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 16, "diagnostics": []}}, {"id": "create_incircle_contact_triangle", "title": "Incircle Contact Triangle", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй вписанную окружность треугольника и точки ее касания со сторонами.", "expected": ["constructs incircle and incenter", "drops perpendiculars to sides to get touchpoints", "marks right angles at contact points"], "mode": "create", "notes": ["Построен треугольник ABC с произвольными невырожденными координатами.", "Вписанная окружность построена через Incircle, центр получен через Center.", "Точки касания D, E, F найдены как основания перпендикуляров из инцентра I на стороны.", "Прямые углы в точках касания отмечены маркерами.", "Вспомогательные перпендикуляры скрыты."], "style": null, "dsl": "# Triangle ABC\nA = Point(-3, -1)\nB = Point(4, -2)\nC = Point(1, 4)\n\n# Triangle sides as explicit segments for clarity\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\n\n# Incenter via incircle\ninc = Incircle(A, B, C)\nI = Center(inc)\n\n# Touchpoints: perpendiculars from incenter to each side\n# Side AB\nperp_AB = Perpendicular s": ["Used internal angle bisector at A and external angle bisector at B to construct excenter I_A opposite A.", "Tangency point T_A on BC obtained by perpendicular from I_A to line BC.", "Right angle marker shown at T_A between BC and radius I_A T_A."], "style": null, "dsl": "# Triangle ABC\nA = Point(-3, 2)\nB = Point(-1, -2)\nC = Point(4, 1)\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\nstyle(A, B, C, label_visible=True)\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\n# Internal angle bisector at A\nbis_A = AngularBisector(B, A, C)\n\n# External angle bisector at B\nbis_B_int = AngularBisector(A, B, C)\next_B = PerpendicularLine(B, bis_B_int)\n\n# Excenter opposite A (intersection of internal bisector at A and external at B)\nI_A = Intersect(bis_A, ext_B)\nstyle(I_A, label_visible=True, label_text=\"$I_A$\", fill=\"color.accent\", size_px=\"point_size.bold\")\n\n# Tangency point on BC: drop perpendicular from I_A to line BC\nperp_BC = PerpendicularLine(I_A, BC)\nT_A = Intersect(perp_BC, BC)\nstyle(T_A, label_visible=True, label_text=\"$T_A$\", fill=\"color.accent\", size_px=\"point_size.bold\")\n\n# Excircle (center I_A, radius I_A T_A)\nexcircle = Circle(I_A, T_A)\nstyle(excircle, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Right angle marker at tangency\nright_angle = Angle(B, T_A, I_A)\nstyle(right_angle, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Hide construction helpers\nhide(bis_A, bis_B_int, ext_B, perp_BC)\n", "dsl_path": "assets/dsl/pro__create_excentral_touchpoint_hint.py", "svg_path": "assets/results/pro__create_excentral_touchpoint_hint.svg", "hash": "efa0d2501b564335", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 520, "scale": 44.89633481265386}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 16, "diagnostics": []}}, {"id": "create_butterfly_theorem_setup", "title": "Butterfly Theorem Setup", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй конфигурацию теоремы о бабочке: хорда PQ с серединой M и две хорды AB и CD через M.", "expected": ["constructs circle and chord PQ", "marks midpoint M of PQ", "draws two chords through M", "does not add unproved equality marks beyond midpoint"], "mode": "create", "notes": ["Chords AB and CD are constructed through M by intersecting lines through M with the circle.", "Midpoint M is constructed as the midpoint of chord PQ.", "Helper points A_dir and C_dir define the directions of the chords; they are hidden.", "Circle center O is hidden as it is not part of the butterfly theorem statement."], "style": null, "dsl": "# Butterfly theorem configuration\n# Circle with center O, chord PQ with midpoint M, chords AB and CD through M\n\nO = Point(0, 0)\nP = Point(-2.1, 1.7)\nQ = Point(2.1, 1.7)\ncircle = Circle(O, P)\n\n# Chord PQ and its midpoint M\nPQ = Segment(P, Q)\nM = Midpoint(P, Q)\n\n# Chords AB and CD through M\n# Choose directions for the chords\nA_dir = Point(1.5, 2.5)\nC_dir = Point(-1.5, 2.5)\n\nline_AB = Line(M, A_dir)\nline_CD = Line(M, C_dir)\n\nA, B = Intersect(line_AB, circle)\nC, D = Intersect(line_CD, circle)\n\nAB = Segment(A, B)\nCD = Segment(C, D)\n\n# Style\nstyle(circle, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(PQ, AB, CD, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(M, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True)\nstyle(P, Q, A, B, C, D, label_visible=True)\nhide(O, A_dir, C_dir, line_AB, line_CD)\n", "dsl_path": "assets/dsl/pro__create_butterfly_theorem_setup.py", "svg_path": "assets/results/pro__create_butterfly_theorem_setup.svg", "hash": "165406f076ec8ea8", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 73.47250707795696}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 18, "diagnostics": []}}, {"id": "create_spiral_similarity_center", "title": "Spiral Similarity Center Sketch", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй две пересекающиеся окружности и точку их пересечения как центр спирального подобия для двух хорд.", "expected": ["constructs two intersecting circles", "marks a shared intersection as center", "draws corresponding chord pairs"], "mode": "create", "notes": ["The shared points S and T are derived by Intersect(c1, c2).", "Both displayed chord endpoints are obtained by intersecting lines through S with the corresponding circle.", "This is a structural sketch of a spiral-similarity-center configuration, not a full proof."], "style": null, "dsl": "# Two intersecting circles; their shared points come from Intersect(c1, c2)\nO1 = Point(-1.5, 0)\nO2 = Point(1.5, 0)\nseed = Point(0, 2)\nc1 = Circle(O1, seed)\nc2 = Circle(O2, seed)\nS, T = Intersect(c1, c2)\n\n# Chord in c1 through the shared point S\nQ1 = Rotate(T, 0.75, O1)\nline1 = Line(S, Q1)\nA, B = Intersect(line1, c1)\n\n# Corresponding chord in c2 through the same center S\nQ2 = Rotate(T, -0.75, O2)\nline2 = Line(S, Q2)\nC, D = Intersect(line2, c2)\n\nchord1 = Segment(A, B)\nchord2 = Segment(C, D)\ncommon_chord = Segment(S, T)\n\nstyle(c1, c2, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(chord1, chord2, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(common_chord, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\nstyle(S, fill=\"color.accent\", size_px=\"point_size.bold\", label_visible=True, label_text=\"$S$\")\nstyle(T, fill=\"color.aux\", size_px=\"point_size.main\", label_visible=True, label_text=\"$T$\")\nstyle(A, B, C, D, label_visible=True)\nhide(O1, O2, seed, Q1, Q2, line1, line2)\n", "dsl_path": "assets/dsl/pro__create_spiral_similarity_center.py", "svg_path": "assets/results/pro__create_spiral_similarity_center.svg", "hash": "2f8353ba7f6c21b8", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 78.53658536585365}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 20, "diagnostics": []}}, {"id": "create_barycentric_centroid_ratio", "title": "Centroid Median Ratio", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй медиану треугольника и отметь, что центр тяжести делит ее в отношении 2:1.", "expected": ["constructs centroid as intersection of medians", "highlights one median", "marks the two parts of the median with different semantic labels"], "mode": "create", "notes": ["Used two medians to construct centroid G, then hid the second median.", "Subdivided median CM into CG and GM to attach ratio labels 2x and x.", "Marked equal halves AM and MB with tick_count=1 to show M is midpoint.", "Labels for CG and GM use label_mode='value' to display the custom text; this may show the segment length as well, but the ratio is the primary intent."], "style": null, "dsl": "# Triangle ABC\nA = Point(-3, -1)\nB = Point(3, -1)\nC = Point(0, 4)\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(A, B, C, label_visible=True)\n\n# Midpoint of AB\nM = Midpoint(A, B)\nstyle(M, label_visible=True)\n\n# Median from C to M\nCM = Segment(C, M)\nstyle(CM, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Centroid G (intersection of medians)\nN = Midpoint(B, C)\nBN = Segment(B, N)\nG = Intersect(CM, BN)\nstyle(G, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\n\n# Hide the second median (only needed to find G)\nhide(BN, N)\n\n# Subdivide CM into CG and GM to show 2:1 ratio\nCG = Segment(C, G)\nGM = Segment(G, M)\nstyle(CG, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(GM, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Mark equal halves on AB (AM = MB)\nAM = Segment(A, M)\nMB = Segment(M, B)\nstyle(AM, MB, stroke=\"color.main\", stroke_width_px=\"line_width.main\", tick_count=1)\n\n# Ratio labels\nstyle(CG, label_visible=True, label_text=\"$2x$\")\nstyle(GM, label_visible=True, label_text=\"$x$\")\n\n# Hide the original full median segment to avoid double drawing\nhide(CM)\n", "dsl_path": "assets/dsl/pro__create_barycentric_centroid_ratio.py", "svg_path": "assets/results/pro__create_barycentric_centroid_ratio.svg", "hash": "3613e488e4ba227f", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 73.02336543118764}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 17, "diagnostics": []}}, {"id": "create_nine_point_center_euler", "title": "Nine-Point Center On Euler Line", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй ортоцентр H, центр описанной окружности O и центр девятиточечной окружности N на прямой Эйлера.", "expected": ["constructs O and H", "constructs N as midpoint of OH", "draws Euler line and nine-point circle"], "mode": "create", "notes": ["Triangle ABC chosen with generic non-degenerate coordinates.", "Orthocenter H constructed as intersection of two altitudes.", "Circumcenter O constructed as intersection of two perpendicular bisectors.", "Nine-point center N is midpoint of OH.", "Nine-point circle drawn through midpoints of sides.", "Euler line drawn through O and H.", "Right angle markers shown at altitude feet.", "Helper lines (side lines, altitude lines, perpendicular bisectors) hidden."], "style": null, "dsl": "# Triangle ABC\nA = Point(-4, -1)\nB = Point(4, -1)\nC = Point(1, 4)\n\nAB = Segment(A, B)\nBC = Segment(B, C)\nCA = Segment(C, A)\n\n# Orthocenter H: altitudes from A and B\n# Altitude from A to BC\nline_BC = Line(B, C)\nalt_A_line = PerpendicularLine(A, line_BC)\nfoot_A = Intersect(alt_A_line, line_BC)\nalt_A = Segment(A, foot_A)\n\n# Altitude from B to CA\nline_CA = Line(C, A)\nalt_B_line = PerpendicularLine(B, line_CA)\nfoot_B = Intersect(alt_B_line, line_CA)\nalt_B = Segment(B, foot_B)\n\nH = Intersect(alt_A_line, alt_B_line)\n\n# Circumcenter O: perpendicular bisectors of AB and BC\nmid_AB = Midpoint(A, B)\nperp_AB = PerpendicularBisector(A, B)\n\nmid_BC = Midpoint(B, C)\nperp_BC = PerpendicularBisector(B, C)\n\nO = Intersect(perp_AB, perp_BC)\n\n# Circumcircle\ncircumcircle = Circle(O, A)\n\n# Nine-point circle center N: midpoint of OH\nN = Midpoint(O, H)\n\n# Nine-point circle: through midpoints of sides\nmid_CA = Midpoint(C, A)\nnine_point_circle = Circle(N, mid_AB)\n\n# Euler line\nEuler_line = Line(O, H)\n\n# Style\nstyle(A, B, C, label_visible=True, fill=\"color.strong\", size_px=\"point_size.bold\")\nstyle(AB, BC, CA, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\n\nstyle(H, O, N, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\nstyle(H, label_text=\"$H$\")\nstyle(O, label_text=\"$O$\")\nstyle(N, label_text=\"$N$\")\n\nstyle(alt_A, alt_B, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", stroke_dasharray=\"4 4\")\nstyle(foot_A, foot_B, fill=\"color.aux\", size_px=\"point_size.aux\", label_visible=False)\n\nstyle(perp_AB, perp_BC, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\", stroke_dasharray=\"4 4\")\nstyle(mid_AB, mid_BC, mid_CA, fill=\"color.aux\", size_px=\"point_size.aux\", label_visible=False)\n\nstyle(circumcircle, stroke=\"color.aux\", stroke_width_px=\"line_width.aux\")\nstyle(nine_point_circle, stroke=\"color.accent\", stroke_width_px=\"line_width.main\")\n\nstyle(Euler_line, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\n\n# Right angle markers at altitude feet\nright_angle_A = Angle(B, foot_A, A)\nright_angle_B = Angle(C, foot_B, B)\nstyle(right_angle_A, right_angle_B, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Hide helper lines\nhide(line_BC, line_CA, alt_A_line, alt_B_line)\n", "dsl_path": "assets/dsl/pro__create_nine_point_center_euler.py", "svg_path": "assets/results/pro__create_nine_point_center_euler.svg", "hash": "1ff9b737ee80c09c", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 500, "scale": 53.3117984219556}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 29, "diagnostics": []}}, {"id": "create_triangle_area_altitude_base", "title": "Triangle Area Base And Height", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй треугольник с основанием AB и высотой CH, визуально выдели основание и высоту для формулы площади.", "expected": ["constructs altitude to AB", "marks right angle at H", "highlights base and height", "does not add numeric text unless requested"], "mode": "create", "notes": [], "style": null, "dsl": "# Triangle with base AB and altitude CH\nA = Point(-3, -1)\nB = Point(3, -1)\nC = Point(0, 3)\n\nAB = Segment(A, B)\nAC = Segment(A, C)\nBC = Segment(B, C)\n\n# Altitude from C to line AB\nline_AB = Line(A, B)\nalt_line = PerpendicularLine(C, line_AB)\nH = Intersect(alt_line, line_AB)\nCH = Segment(C, H)\n\n# Right angle marker at H\nright_angle = Angle(A, H, C)\n\n# Style: base and altitude highlighted\nstyle(AB, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(CH, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(AC, BC, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(right_angle, right_angle_marker=True, right_angle_size_px=\"angle_radius.right\")\n\n# Hide construction helpers\nhide(line_AB, alt_line)\n\n# Labels\nstyle(A, B, C, H, label_visible=True)\nstyle(CH, label_text=\"h\")\nstyle(AB, label_text=\"b\")\n", "dsl_path": "assets/dsl/pro__create_triangle_area_altitude_base.py", "svg_path": "assets/results/pro__create_triangle_area_altitude_base.svg", "hash": "0353209c97532c62", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 83.77142788499567}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 13, "diagnostics": []}}, {"id": "create_circle_annulus_radii", "title": "Concentric Circles Annulus", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй две концентрические окружности с центром O и покажи внутренний и внешний радиусы.", "expected": ["constructs two concentric circles", "draws two radii", "labels them with semantic names"], "mode": "create", "notes": [], "style": null, "dsl": "O = Point(0, 0)\nA = Point(2, 0)\nB = Point(4, 0)\ninner = Circle(O, A)\nouter = Circle(O, B)\nr_in = Segment(O, A)\nr_out = Segment(O, B)\nstyle(inner, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(outer, stroke=\"color.main\", stroke_width_px=\"line_width.main\")\nstyle(r_in, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(r_out, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(O, label_visible=True, fill=\"color.strong\", size_px=\"point_size.bold\")\nstyle(A, label_visible=False, fill=\"color.aux\", size_px=\"point_size.aux\")\nstyle(B, label_visible=False, fill=\"color.aux\", size_px=\"point_size.aux\")\nstyle(r_in, label_visible=True, label_text=\"$r_{in}$\")\nstyle(r_out, label_visible=True, label_text=\"$r_{out}$\")\n", "dsl_path": "assets/dsl/pro__create_circle_annulus_radii.py", "svg_path": "assets/results/pro__create_circle_annulus_radii.svg", "hash": "cf5db0687307d635", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 52.109375}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 9, "diagnostics": []}}, {"id": "create_sector_with_area_value", "title": "Sector Angle And Radius", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй сектор окружности AOB, выдели радиусы и центральный угол.", "expected": ["constructs sector boundary", "shows both radii", "labels central angle", "does not invent a numeric area value"], "mode": "create", "notes": [], "style": null, "dsl": "O = Point(0, 0)\nA = Point(3, 0)\nB = Rotate(A, 2 * pi / 3, O)\n\ncircle = Circle(O, A)\nsector = CircleSector(O, A, B)\nOA = Segment(O, A)\nOB = Segment(O, B)\ncentral_angle = Angle(A, O, B)\n\nstyle(sector, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\", fill=\"color.accent\")\nstyle(OA, OB, stroke=\"color.accent\", stroke_width_px=\"line_width.bold\")\nstyle(central_angle, arc_size_px=\"angle_radius.bold\", tick_count=1, label_visible=True, label_text=\"$120^\\\\circ$\")\nstyle(O, A, B, label_visible=True, fill=\"color.accent\", size_px=\"point_size.bold\")\n", "dsl_path": "assets/dsl/pro__create_sector_with_area_value.py", "svg_path": "assets/results/pro__create_sector_with_area_value.svg", "hash": "1bc9a658ec734580", "status": "rendered", "diagnostics": [], "viewport": {"width": 700, "height": 460, "scale": 67.37373737373737}, "summary": {"schema": "animageo-construction-render-summary/v1", "element_count": 10, "diagnostics": []}}, {"id": "create_sine_cosine_unit_circle", "title": "Unit Circle Projection", "variant": "pro", "model": "deepseek-v4-pro", "kind": "create", "prompt": "Построй единичную окружность, точку P на ней и проекции, показывающие cos и sin.", "expected": ["constructs circle and point on it", "draws horizontal and vertical projections", "labels projection segments cos and sin"], "mode": "create", "notes": ["Point P is placed at angle pi/3 on the unit circle using rotation for determinism.", "Projection feet are constructed from P.x and P.y, which are valid dependent points.", "Labels for cos and sin are placed on the corresponding segments."], "style": null, "dsl": "O = Point(0, 0)\nA = Point(1, 0)\nB = Point(0, 1)\nx_axis = Line(O, A)\ny_axis = Line(O, B)\ncircle = Circle(O, A)\nP = Rotate(A, pi/3, O)\ncos_line = PerpendicularLine(P, x_axis)\nsin_line = PerpendicularLine(P, y_axis)\ncos_foot = Intersect(cos_line, x_axis)\nsin_foot = Intersect(sin_line, y_axis)\ncos_seg = Segment(O, cos_foot)\nsin_seg = Segment(O, sin_foot)\nc <script>
(function () {
  "use strict";
  const payload = JSON.parse(document.getElementById("library-data").textContent);
  const records = payload.records || [];

  const variants = Array.from(new Set(records.map(rec => rec.variant || "flash")));

  const storageKey = "animageo-ai-construction-lab-feedback-v1";
  const ratingOptions = [["unset","Unset"],["pass","Pass"],["partial","Partial"],["fail","Fail"],["unsafe","Unsafe"]];
  const issueKeys = [
    ["construction_error", "Ошибка конструкции"],
    ["style_misuse", "Стиль засунут в DSL"],
    ["unsupported", "Неподдержано"],
    ["ambiguity", "Не снята неоднозначность"],
    ["naming", "Проблемы с именами"],
    ["good_pattern", "Хороший паттерн"]
  ];
  const PY_KEYWORDS = new Set(["for","if","else","elif","while","def","class","return","with","as","in","not","and","or","is","lambda","True","False","None","pass","break","continue","try","except","finally"]);
