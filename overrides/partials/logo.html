{# Match the theme-aware logo pair used by the main AnimaGeo application. #}
<span class="animageo-theme-logo">
  <img
    class="animageo-theme-logo__image animageo-theme-logo__image--light"
    src="{{ 'assets/images/logo.png' | url }}"
    alt="logo"
  >
  <img
    class="animageo-theme-logo__image animageo-theme-logo__image--dark"
    src="{{ 'assets/images/logo-dark.png' | url }}"
    alt="logo"
  >
</span>
