site_name: AnimaGeo
site_description: GeoGebra constructions rendered as SVG, TikZ, interactive JSXGraph, and Manim animations
site_url: https://docs.animageo.ru/
repo_url: https://github.com/ivaleo/animageo
repo_name: ivaleo/animageo
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - Getting started: quickstart.md
  - Guides:
      - Python DSL: python_dsl.md
      - Styles: styles.md
      - GeoGebra import policies: import_policies.md
      - Keyframe animation: keyframes.md
      - Export formats: export_formats.md
      - TikZ export: tikz_export.md
  - Reference:
      - API: api.md
      - Geometry field names: field_names.md
      - Construction summary: construction_summary.md
      - Architecture: architecture.md
      - Gotchas: gotchas.md
  - AI agents:
      - Style-generation context: ai_style_generation_context.md
      - Construction-generation context: ai_construction_generation_context.md
  - Direction: roadmap.md
  - AnimaGeo.ru ↗: https://animageo.ru/

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: AnimaGeo — Документация
          site_description: Документация библиотеки AnimaGeo для Python
          nav_translations:
            Overview: Обзор
            Getting started: Быстрый старт
            Guides: Руководства
            Python DSL: Python DSL
            Styles: Стили
            GeoGebra import policies: Правила импорта GeoGebra
            Keyframe animation: Анимация по ключевым кадрам
            Export formats: Форматы экспорта
            TikZ export: Экспорт TikZ
            Reference: Справочник
            API: API
            Geometry field names: Поля геометрических объектов
            Construction summary: Сводка конструкции
            Architecture: Архитектура
            Gotchas: Особенности и ограничения
            AI agents: Для AI-агентов
            Style-generation context: Контекст генерации стилей
            Construction-generation context: Контекст генерации конструкций
            Direction: Развитие
            AnimaGeo.ru ↗: AnimaGeo.ru ↗

extra_css:
  - assets/stylesheets/animageo.css

copyright: AnimaGeo — open-source geometry rendering for Python

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

exclude_docs: |
  archive/
  guide/
  ai_construction_lab/
  superpowers/
  ai_construction_generation_plan.md
  ai_usage_open_questions.md
