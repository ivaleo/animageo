site_name: AnimaGeo
site_description: GeoGebra constructions rendered as SVG, TikZ, interactive JSXGraph, and Manim animations
site_url: https://docs.animageo.ru/
repo_url: https://github.com/ivaleo/animageo
repo_name: ivaleo/animageo
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - Getting started: quickstart.md
  - Guides:
      - Python DSL: python_dsl.md
      - Styles: styles.md
      - GeoGebra import policies: import_policies.md
      - Keyframe animation: keyframes.md
      - Export formats: export_formats.md
      - TikZ export: tikz_export.md
  - Reference:
      - API: api.md
      - Geometry field names: field_names.md
      - Construction summary: construction_summary.md
      - Architecture: architecture.md
      - Gotchas: gotchas.md
  - AI agents:
      - Style-generation context: ai_style_generation_context.md
      - Construction-generation context: ai_construction_generation_context.md
  - Direction: roadmap.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

exclude_docs: |
  archive/
  guide/
  ai_construction_lab/
  superpowers/
  ai_construction_generation_plan.md
  ai_usage_open_questions.md
