name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # manim toolchain (cairo/pango build deps, ffmpeg) + LaTeX for Tex
      # labels (incl. Cyrillic) and dvisvgm for manim's Tex → SVG pipeline.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg \
            texlive texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-cyrillic texlive-science dvisvgm

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # namespace.pyi / dsl.pyi declare exactly the factories of the DSL
      # (COMMAND_REGISTRY); a new command needs `_regen_stubs --write`.
      - name: Check the DSL stubs
        run: python -m animageo.parsers.dsl._regen_stubs --check

      - name: Run tests
        run: python -m pytest tests/ -q -m "not fuzz"

      # Hostile and random input of the importers: 10³ random cases per run,
      # new seeds every run (a failure names its seed; ANIMAGEO_FUZZ_SEED
      # reproduces it).
      - name: Fuzz
        env:
          ANIMAGEO_FUZZ_SEED: ${{ github.run_number }}000
        run: python -m pytest tests/ -q -m fuzz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime unit tests
        run: cd web/runtime && node --test
      - name: Web-component unit tests
        run: cd web/web-component && node --test
