name: release-platform-diagnostics

on:
  push:
    branches: [ci/release-1.11.3-diagnostics]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55928c30230f12beedb74d555857044501625e29
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      # No apt, pip, fonts, manim, pytest, rendering, corpus, or package builds.
      - name: Prepare read-only source and external payload
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 55928c30230f12beedb74d555857044501625e29
          mkdir -p "$RUNNER_TEMP/space311-artifact" "$RUNNER_TEMP/space311-a3"
          git archive a3ebd215ebb7faae0f83e80bd05e7baf1cb35f75 | tar -x -C "$RUNNER_TEMP/space311-a3"
          git rev-parse HEAD > "$RUNNER_TEMP/space311-artifact/current-ref.txt"
          git rev-parse a3ebd215ebb7faae0f83e80bd05e7baf1cb35f75 > "$RUNNER_TEMP/space311-artifact/baseline-ref.txt"
          cat > "$RUNNER_TEMP/ci-python311-space-probe.py" <<'PYCODE'
          #!/usr/bin/env python3
          """Read-only Linux/Python3.11 space depth-order diagnostic.
          
          No tests, rendering, installation or source writes. scene.sum is temporarily
          changed only in this diagnostic process, never vec.sum or builtins.sum.
          """
          import argparse
          import builtins
          import hashlib
          import importlib
          import importlib.abc
          import json
          import math
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          
          sys.dont_write_bytecode = True
          
          
          def dump(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + '\n')
          
          
          def fingerprint(repo):
              paths = list((repo / 'animageo/native/space').glob('*.py'))
              paths += list((repo / 'animageo/native/parity/v1/space').glob('*.json'))
              return {str(p.relative_to(repo)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          
          
          def differences(old, new, ptr=''):
              if old == new:
                  return []
              if isinstance(old, dict) and isinstance(new, dict) and set(old) == set(new):
                  return [d for k in sorted(old) for d in differences(old[k], new[k],
                          ptr + '/' + k.replace('~', '~0').replace('/', '~1'))]
              if isinstance(old, list) and isinstance(new, list) and len(old) == len(new):
                  return [d for i, (a, b) in enumerate(zip(old, new)) for d in differences(a, b, ptr + '/' + str(i))]
              row = {'pointer': ptr, 'old': old, 'new': new, 'source_document': '/document/' in ptr}
              if all(isinstance(v, (int, float)) and not isinstance(v, bool) for v in (old, new)):
                  a, b = float(old), float(new)
                  row.update(abs_delta=abs(a - b), old_hex=a.hex(), new_hex=b.hex(),
                             ulps=abs(a - b) / max(math.ulp(a), math.ulp(b)))
              return [row]
          
          
          def bits(value):
              return {'value': float(value), 'hex': float(value).hex()}
          
          
          class NoClassic(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname == 'manim' or fullname.startswith(('manim.', 'animageo.geo', 'animageo.animageo')):
                      raise ImportError('Probe forbids classic/render import: ' + fullname)
          
          
          def trace_target(fx, scene):
              target = next(row for _stem, rows in fx.flat_themes() for row in rows if row[0] == 'section_hidden_solid')
              _name, item, centre, _cameras = target
              doc = item.data() if hasattr(item, 'data') else item
              camera = fx._camera('persp', centre)
              trace = {'fills': [], 'sorts': []}
          
              def observer(frame, event, result):
                  if event != 'return' or frame.f_code.co_filename != scene.__file__:
                      return
                  local = frame.f_locals
                  if frame.f_code.co_name == 'fill' and isinstance(result, dict) and result.get('id') in ('P', 'S'):
                      z = [p[2] for p in local['pts']]
                      folded = 0.0
                      partial = []
                      for value in z:
                          folded += value
                          partial.append(bits(folded))
                      trace['fills'].append({'id': result['id'], 'role': result['role'],
                          'world_vertices': [[bits(v) for v in p] for p in local['polygon']],
                          'projected': [[bits(v) for v in p] for p in local['pts']],
                          'partial_left_fold': partial, 'builtin_sum': bits(builtins.sum(z)),
                          'fsum': bits(math.fsum(z)), 'left_mean': bits(folded / len(z)),
                          'builtin_mean': bits(builtins.sum(z) / len(z)),
                          'fsum_mean': bits(math.fsum(z) / len(z)), 'actual_depth': bits(result['depth'])})
                  elif frame.f_code.co_name == 'far_first' and local.get('items'):
                      trace['sorts'].append({'keys_before': [
                          {'id': f['id'], 'key': [bits(-f['depth']), f['id'], f['part'] or '']}
                          for f in local['items']], 'order_after': [f['id'] for f in result]})
          
              previous = sys.getprofile()
              sys.setprofile(observer)
              try:
                  raw = scene.flat_scene(doc, camera, plane_look='sheet')
              finally:
                  sys.setprofile(previous)
              trace.update(camera=camera, document=doc, raw_flat_scene=raw)
              return trace
          
          
          def phase(fx, scene, out, name):
              target = trace_target(fx, scene)
              dump(out / (name + '-target-trace.json'), target)
              fresh = fx.build_fixtures()  # in-memory space cases only
              changes = {}
              for filename, value in sorted(fresh.items()):
                  stored = json.loads((fx.DEFAULT_DIR / filename).read_text())
                  old = {k: v for k, v in stored.items() if k != 'generatedBy'}
                  new = json.loads(json.dumps({k: v for k, v in value.items() if k != 'generatedBy'}))
                  delta = differences(old, new)
                  if delta:
                      changes[filename] = delta
              files, cases, replay = fx.verify_fixtures()
              report = {'scene_sum_override': 'sum' in vars(scene), 'freshness': changes,
                        'files': files, 'cases': cases, 'replay_mismatches': replay,
                        'target_order': [f['id'] for f in target['raw_flat_scene']['fills']]}
              dump(out / (name + '-summary.json'), report)
              print(json.dumps({'phase': name, 'stale_files': list(changes), 'replay_count': len(replay),
                                'target_order': report['target_order']}), flush=True)
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--repo', type=Path, required=True)
              parser.add_argument('--out', type=Path, required=True)
              parser.add_argument('--source-ref', required=True)
              args = parser.parse_args()
              if os.environ.get('GITHUB_ACTIONS') != 'true' or platform.system() != 'Linux' or sys.version_info[:2] != (3, 11):
                  raise SystemExit('Remote Linux Python3.11 only; no local execution.')
              repo, out = args.repo.resolve(), args.out.resolve()
              if out.is_relative_to(repo):
                  raise SystemExit('Output must be outside source/package.')
              out.mkdir(parents=True, exist_ok=False)
              os.chdir(repo)
              sys.path.insert(0, str(repo))
              sys.meta_path.insert(0, NoClassic())
              before = fingerprint(repo)
              dump(out / 'source-before.json', before)
              try:
                  import animageo
                  fx = importlib.import_module('animageo.native.space.fixtures')
                  scene = importlib.import_module('animageo.native.space.scene')
                  dump(out / 'provenance.json', {'requested_source_ref': args.source_ref,
                      'python': sys.version, 'executable': sys.executable, 'platform': platform.platform(),
                      'animageo_file': animageo.__file__, 'version': animageo.__version__,
                      'scene_file': scene.__file__, 'vec_file': scene.vec.__file__,
                      'scene_sum_original': 'sum' in vars(scene), 'vec_sum_original': 'sum' in vars(scene.vec),
                      'git': subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True).stdout.strip()})
                  if 'sum' in vars(scene):
                      raise RuntimeError('Unexpected existing scene.sum override; do not mask it.')
                  phase(fx, scene, out, 'original')
                  scene.sum = math.fsum
                  try:
                      phase(fx, scene, out, 'scene-fsum-only')
                  finally:
                      del scene.sum
                  dump(out / 'override-restored.json', {'scene_sum_absent': 'sum' not in vars(scene),
                                                        'vec_sum_absent': 'sum' not in vars(scene.vec),
                                                        'builtin_sum_unchanged': builtins.sum is sum})
              finally:
                  after = fingerprint(repo)
                  dump(out / 'source-preservation.json', {'before': before, 'after': after, 'unchanged': before == after})
          
          
          if __name__ == '__main__':
              main()
          PYCODE
          sha256sum "$RUNNER_TEMP/ci-python311-space-probe.py" > "$RUNNER_TEMP/space311-artifact/probe.sha256"
      - name: Current55928 space trace and isolated fsum control
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 90s python "$RUNNER_TEMP/ci-python311-space-probe.py" \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/space311-artifact/current" \
            --source-ref 55928c30230f12beedb74d555857044501625e29 \
            > "$RUNNER_TEMP/space311-artifact/current.log" 2>&1
      - name: Baselinea3 same interpreter fresh process and control
        if: always()
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 90s python "$RUNNER_TEMP/ci-python311-space-probe.py" \
            --repo "$RUNNER_TEMP/space311-a3" --out "$RUNNER_TEMP/space311-artifact/baseline" \
            --source-ref a3ebd215ebb7faae0f83e80bd05e7baf1cb35f75 \
            > "$RUNNER_TEMP/space311-artifact/baseline.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python311-space-causal-probe
          path: ${{ runner.temp }}/space311-artifact
          retention-days: 3
